name: Repository checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight validation dependencies
        run: python -m pip install pytest pyyaml
      - name: Run event-contract tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q streaming model tests
      - name: Validate Docker Compose syntax
        run: docker compose config >/dev/null
      - name: Validate JSON / YAML assets
        run: |
          python - <<'PY'
          import json, pathlib, yaml
          json.loads(pathlib.Path('observability/grafana/dashboards/roadwatch.json').read_text())
          for path in [
              pathlib.Path('observability/prometheus/prometheus.yml'),
              pathlib.Path('observability/grafana/provisioning/datasources/datasource.yml'),
              pathlib.Path('observability/grafana/provisioning/dashboards/dashboard.yml'),
          ]:
              yaml.safe_load(path.read_text())
          PY
