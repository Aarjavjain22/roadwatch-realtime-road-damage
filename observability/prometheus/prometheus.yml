global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: producer
    static_configs:
      - targets: ["producer:8001"]

  - job_name: yolo-consumer
    static_configs:
      - targets: ["yolo-consumer:8002"]

  - job_name: analytics-consumer
    static_configs:
      - targets: ["analytics-consumer:8003"]
